name: Deploy CampusConnect

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/campusconnect_deploy_key
          chmod 600 ~/.ssh/campusconnect_deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/campusconnect_deploy_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'EOF'
          set -e

          cd /home/ubuntu/CampusConnect

          echo "Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          echo "Installing dependencies..."
          npm ci

          echo "Building Next.js..."
          NODE_OPTIONS="--max-old-space-size=1536" npm run build

          echo "Restarting CampusConnect..."
          pm2 restart campusconnect --update-env

          echo "Saving PM2 process..."
          pm2 save

          echo "Deployment successful!"
          EOF
